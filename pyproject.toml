[project]
name = "gen-dsp"
version = "0.5.0"
description = "Generate multiple dsp plugin formats from Max gen~ exports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Spears" },
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
keywords = [
    "puredata",
    "pd",
    "max",
    "msp",
    "gen~",
    "dsp",
    "audio",
    "external",
    "chuck",
    "audiounit",
    "clap",
    "vst3",
    "lv2",
    "supercollider",
    "vcvrack",
    "daisy",
    "circle",
    "touchosc",
    "osc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Other Audience",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
graph = ["pydantic>=2.0"]
sim = ["pydantic>=2.0", "numpy>=1.24"]
tosc = ["py2tosc>=0.6.0"]

[dependency-groups]
dev = [
    "minihost>=0.11.0; python_version < '3.15'",
    "mypy>=2.4.0",
    "numpy>=2.4.6",
    "py2tosc>=0.6.0",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "twine>=7.0.0",
]

[project.scripts]
gen-dsp = "gen_dsp.cli:main"

[project.urls]
Homepage = "https://github.com/shakfu/gen-dsp"
Repository = "https://github.com/shakfu/gen-dsp"
Changelog = "https://github.com/shakfu/gen-dsp/blob/master/CHANGELOG.md"
Issues = "https://github.com/shakfu/gen-dsp/issues"

